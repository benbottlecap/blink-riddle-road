<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink and the Riddle Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Grandstander:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: picture of the place beside the words on a wide screen, picture above the words on a narrow one. The riddle card is the only boxed element in the story. */
  --deep: #080f21;
  --night: #0f1a33;
  --panel: #1b2948;
  --ink: #f5eeda;
  --soft: #aab7d6;
  --glow: #ffd35c;
  --leaf: #93dbb0;
  --display: "Grandstander", "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", sans-serif;
  --body: "Andika", Verdana, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image: linear-gradient(var(--deep), var(--night) 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.25rem;
  line-height: 1.6;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app {
  position: relative;
  z-index: 1;
  max-width: 1140px;
  margin: 0 auto;
  padding: 12px 20px 64px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible, summary:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

.hud { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; min-height: 48px; }
.brand {
  margin-right: auto;
  background: none;
  border: none;
  padding: 10px 0;
  font-family: var(--display);
  font-weight: 500;
  font-size: 0.95rem;
  color: var(--soft);
  text-align: left;
}
.meter { display: flex; align-items: center; }
.dots { display: flex; gap: 6px; }
.dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--soft); opacity: 0.55; }
.dot.lit { background: var(--glow); border-color: var(--glow); opacity: 1; box-shadow: 0 0 10px 2px rgba(255, 211, 92, 0.55); }
.tally { font-family: var(--display); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.on { color: var(--glow); }
.off { color: var(--soft); opacity: 0.35; }
.chip {
  min-height: 44px;
  padding: 6px 16px;
  border-radius: 999px;
  border: 1.5px solid rgba(170, 183, 214, 0.5);
  background: rgba(27, 41, 72, 0.6);
  font-family: var(--display);
  font-weight: 500;
  font-size: 0.9rem;
}

.stage { display: flex; flex-direction: column; gap: 22px; }
.art {
  width: 100%;
  max-width: 620px;
  align-self: center;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid rgba(170, 183, 214, 0.28);
  background: var(--deep);
}
.art svg { display: block; width: 100%; height: auto; }
.art .spot { cursor: pointer; }
.art .spot:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
.blink .halo { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(0.72); } }

#scene { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
#scene.enter { animation: arrive 0.45s ease-out; }
@keyframes arrive { from { opacity: 0.2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 2.3rem;
  line-height: 1.1;
  margin: 4px 0 0;
  color: var(--glow);
  text-wrap: balance;
}
.place {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--soft);
  margin: 0;
}
.place:focus, .answer:focus { outline: none; }
.words { display: flex; flex-direction: column; gap: 14px; }
.words p { margin: 0; }
.small { margin: 0; color: var(--soft); font-size: 1.05rem; }

.riddle {
  background: var(--panel);
  border: 1px solid rgba(255, 211, 92, 0.45);
  border-radius: 18px;
  padding: 18px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.riddle .tag {
  font-family: var(--display);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--glow);
  margin: 0;
}
.lines {
  font-family: var(--display);
  font-weight: 500;
  font-size: 1.3rem;
  line-height: 1.4;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick {
  min-height: 56px;
  padding: 10px 20px;
  border-radius: 999px;
  border: 2px solid var(--soft);
  background: transparent;
  text-align: left;
  font-size: 1.15rem;
}
.pick:active { background: rgba(170, 183, 214, 0.15); }
.pick[disabled] { cursor: default; opacity: 0.45; text-decoration: line-through; }
.pick.card {
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 12px 10px 14px;
  text-align: center;
  line-height: 1.25;
}
.pick.card[disabled] { text-decoration: none; opacity: 0.4; }
.pick.card[disabled] .lbl { text-decoration: line-through; }
.pic { display: block; flex: none; width: 72px; }
.pic svg { display: block; width: 100%; height: auto; }
.pic text { font-family: var(--display); font-weight: 700; }
.pick.strong { border-color: var(--glow); font-family: var(--display); font-weight: 700; }
.hint { margin: 0; color: var(--soft); font-size: 1.1rem; min-height: 1px; }
.answer { margin: 0; display: flex; align-items: center; gap: 14px; font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--leaf); }
.answer .pic { width: 64px; }
.answer .stars { margin-left: 8px; letter-spacing: 2px; }

.seq { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seq .pic { width: 44px; }
#mazeBox { width: 100%; max-width: 560px; align-self: center; touch-action: none; -webkit-user-select: none; user-select: none; }
#mazeBox svg { display: block; width: 100%; height: auto; touch-action: none; }
.pad { display: grid; grid-template-columns: repeat(3, 68px); grid-template-rows: 58px 58px; gap: 8px; justify-content: center; }
.pad button { border-radius: 14px; border: 2px solid var(--soft); background: transparent; font-size: 1.6rem; line-height: 1; }
.pad button:active { background: rgba(170, 183, 214, 0.2); }
.pad .u { grid-column: 2; grid-row: 1; }
.pad .l { grid-column: 1; grid-row: 2; }
.pad .d { grid-column: 2; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mem button { aspect-ratio: 1; padding: 6px; border-radius: 16px; border: 2px solid var(--soft); background: transparent; display: flex; align-items: center; justify-content: center; }
.mem button .pic { width: 100%; max-width: 96px; }
.mem button.up { border-color: var(--glow); }
.mem button.done { border-color: var(--leaf); opacity: 0.7; cursor: default; }
.mem .back { width: 46%; aspect-ratio: 1; border-radius: 50%; border: 3px dotted var(--soft); opacity: 0.6; }
.chaps { display: flex; flex-direction: column; gap: 10px; }
.chap[aria-current="true"] { background: rgba(255, 211, 92, 0.22); }
.chip.wide { align-self: flex-start; min-height: 48px; font-size: 1rem; }
.chip[aria-pressed="true"] { border-color: var(--glow); }
.names { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--soft); }
.field input { width: 100%; min-height: 58px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--soft); background: var(--panel); color: var(--ink); font-family: var(--body); font-weight: 400; font-size: 1.25rem; }
.field input::placeholder { color: var(--soft); opacity: 0.6; }
.field input:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; border-color: var(--glow); }
.chap { display: flex; align-items: center; gap: 14px; min-height: 70px; padding: 10px 16px; border-radius: 16px; border: 2px solid var(--glow); background: rgba(255, 211, 92, 0.08); text-align: left; }
.chap .n { flex: none; width: 1.5em; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.6rem; color: var(--glow); }
.chap .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.chap .t b { font-family: var(--display); }
.chap .t span { color: var(--soft); font-size: 0.95rem; }
.chap .s { margin-left: auto; flex: none; font-family: var(--display); font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
.chap[disabled] { border-color: rgba(170, 183, 214, 0.4); background: transparent; opacity: 0.6; cursor: default; }
.road { width: 100%; max-width: 420px; align-self: center; border-radius: 18px; border: 1px solid rgba(170, 183, 214, 0.28); background: var(--deep); padding: 6px; }
.road svg { display: block; width: 100%; height: auto; }
.road text { font-family: var(--display); }
.key { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: baseline; }
.key.gold { background: var(--glow); margin-left: 0; }
.key.green { border: 2px solid var(--leaf); }
.key.none { border: 2px dashed var(--soft); }
.trail { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 4px; font-size: 1.1rem; }
.trail b { color: var(--glow); font-weight: 400; }
.book h2 { margin: 12px 0 0; font-family: var(--display); font-weight: 700; font-size: 1.1rem; color: var(--glow); }
.entry .seq { padding: 0 16px 10px; }
.entry .seq .pic { width: 34px; }
.knock { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 22px; }
.knocker {
  width: 124px;
  height: 124px;
  flex: none;
  border-radius: 50%;
  border: 6px solid var(--glow);
  background: radial-gradient(circle at 40% 35%, #7a5637, #4a311d);
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.3rem;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
}
.knocker:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.knocker.bump { animation: bump 0.16s ease-out; }
@keyframes bump { 40% { transform: scale(0.93); } }
.count { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

.ways { display: flex; flex-direction: column; gap: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(170, 183, 214, 0.25); }
.saved { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.1rem; color: var(--glow); }
.saved:focus { outline: none; }
.say { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip.talk { border-color: var(--glow); font-weight: 700; }
.chip.talk[aria-pressed="true"] { background: rgba(255, 211, 92, 0.22); }
.now { background: rgba(255, 211, 92, 0.14); box-shadow: 0 0 0 7px rgba(255, 211, 92, 0.14); border-radius: 8px; }
.ways .ask { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.1rem; color: var(--glow); }
.go {
  min-height: 62px;
  padding: 12px 18px;
  border-radius: 16px;
  border: 2px solid var(--glow);
  background: rgba(255, 211, 92, 0.1);
  text-align: left;
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.go:active { background: rgba(255, 211, 92, 0.25); }
.go .arrow { color: var(--glow); flex: none; }
.go.quiet { border-color: rgba(170, 183, 214, 0.6); background: transparent; font-weight: 500; }
.go.quiet .arrow { color: var(--soft); }

.score { border-top: 1px solid rgba(255, 211, 92, 0.4); padding-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.score p { margin: 0; }
.score b { color: var(--glow); font-variant-numeric: tabular-nums; }
.end { font-family: var(--display); font-weight: 700; font-size: 1.8rem; color: var(--glow); }

.book { display: flex; flex-direction: column; gap: 10px; }
.entry { border: 1px solid rgba(170, 183, 214, 0.35); border-radius: 14px; background: rgba(27, 41, 72, 0.6); }
.entry summary, .entry.locked {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 10px 16px;
}
.entry .pic { width: 42px; }
.entry summary { cursor: pointer; list-style: none; }
.entry summary::-webkit-details-marker { display: none; }
.entry .ans { font-family: var(--display); font-weight: 700; color: var(--leaf); }
.entry .where { margin-left: auto; color: var(--soft); font-size: 0.95rem; text-align: right; }
.entry.locked { opacity: 0.6; }
.entry.locked .ans { color: var(--soft); }
.entry .lines { padding: 0 16px 16px; font-size: 1.1rem; }

@media (min-width: 700px) {
  body { font-size: 1.4rem; }
  h1 { font-size: 3rem; }
  .lines { font-size: 1.5rem; }
  .entry .lines { font-size: 1.2rem; }
  .pick { font-size: 1.3rem; min-height: 62px; }
  .pic { width: 92px; }
  .seq .pic { width: 54px; }
  .entry .seq .pic { width: 40px; }
  .answer .pic { width: 76px; }
  .entry .pic { width: 48px; }
  .go { font-size: 1.35rem; min-height: 68px; }
  .brand, .chip { font-size: 1rem; }
}
@media (min-width: 960px) {
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .art { position: sticky; top: 16px; max-width: none; align-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  #scene.enter, .blink .halo, .knocker.bump { animation: none; }
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header class="hud" id="hud"></header>
  <div class="stage">
    <div class="art" id="art"></div>
    <main id="scene"></main>
  </div>
</div>
<script>
const STORY = {
  start: {
    place: `Your bedroom`,
    title: `Blink and the Riddle Road`,
    text: [
      `You are snug in bed, Maven. Ella the elephant is under one arm. Sharky the shark is under the other.`,
      `The house is quiet. A full moon hangs outside your window, as round and white as a dinner plate.`,
      `<i>Tap. Tap. Tap.</i>`,
      `Something tiny is knocking on the glass. You pull back the curtain. It is a firefly! But his light is very dim, like a flashlight with tired batteries.`,
      `“Hello,” he whispers. “My name is Blink. I am lost. I need to get home to the Lantern Tree before my light goes out.”`,
      `“I am Maven,” you whisper back. “This is Ella, and this is Sharky. How do you get to the Lantern Tree?”`,
      `“By the Riddle Road,” says Blink. “But every helper on the road asks a riddle. And they are not easy ones. I am terrible at riddles. Are you any good?”`,
      `You grin. You are <i>very</i> good at riddles.`,
      `“Oh, good,” says Blink. “Here is a firefly secret. We glow brighter near bright ideas. Every riddle you solve will make my light stronger. I need eight of them to shine all the way home.”`,
      `You put on your slippers. You tuck Ella under one arm and Sharky under the other. Then you tiptoe outside.`,
      `The grass is cool and wet on your ankles. Crickets are singing. Two paths lead away from your yard. One goes into the dark trees. One runs beside the water.`
    ],
    ask: `Which way do you go?`,
    choices: [
      { label: `Walk into the Whispering Woods`, to: `woods` },
      { label: `Follow the Silver Stream`, to: `stream` }
    ]
  },

  woods: {
    place: `The Whispering Woods`,
    text: [
      `The trees are tall here. Their leaves whisper, <i>shh, shh, shh,</i> as if the whole forest is trying to fall asleep.`,
      `Blink flies ahead. His light is so small that you can hardly see your own slippers. Little hard things crunch under your feet.`,
      `In the crook of a great oak tree sits an owl with round gold eyes.`,
      `“Whooo goes there?” she asks.`,
      `“A lost firefly and his three friends,” you say. “We are looking for the Lantern Tree.”`,
      `The owl turns her head almost all the way around to look at Ella and Sharky.`,
      `“An elephant and a shark in my woods,” she says. “Now I have seen everything. I know the way. But first, tell me what this is.”`
    ],
    riddle: {
      lines: [
        `I am smaller than your thumb, and I wear a little cap.`,
        `A giant is folded up inside me.`,
        `Plant me and wait, and the giant will stand taller than a house.`,
        `What am I?`
      ],
      options: [
        { label: `A mushroom`, hint: `A mushroom is small and wears a cap. That part fits. But there is no giant inside. A mushroom stays small. Try again!` },
        { label: `An egg`, hint: `An egg has a baby animal folded up inside. But an egg wears no cap, and nothing grows if you plant one. Try again!` },
        { label: `An acorn`, correct: true },
        { label: `A sunflower seed`, hint: `So close! A sunflower grows tall, but not taller than a house. And its seed has a striped shell, not a cap. Try again!` }
      ],
      after: [
        `You think about the little hard things under your slippers. You pick one up. It is wearing a tiny brown cap.`,
        `“An acorn!” you say.`,
        `The owl blinks slowly. “Clever. This whole oak tree was once folded up inside an acorn no bigger than your thumb.”`,
        `Blink’s light glows a little brighter. “That was a bright idea!” he says.`,
        `The owl points one wing up the path. “The road splits ahead. Blueberry Hill is up high. The Hollow Log is down low. Both will take you onward.”`
      ]
    },
    ask: `Which way do you go?`,
    choices: [
      { label: `Climb Blueberry Hill`, to: `hill` },
      { label: `Crawl through the Hollow Log`, to: `log` }
    ]
  },

  hill: {
    place: `Blueberry Hill`,
    text: [
      `You climb up, up, up. Blink rides on your shoulder. Ella and Sharky ride in your arms.`,
      `The trees end, and the sky opens wide above you.`,
      `At the top, a hare lies on her back in the clover. Her long ears are spread out like a pillow. She is looking straight up.`,
      `“Four hundred and six,” she mutters. “Four hundred and seven. Oh, bother. Now I have lost my place.”`,
      `“What are you counting?” asks Blink.`,
      `“I count them every night,” says the hare. “I always fall asleep before I finish. You tell me what they are. Then I will show you the way down.”`
    ],
    riddle: {
      lines: [
        `We are up there all day, but the sun hides us.`,
        `The darker it gets, the better we show.`,
        `We look like cold little sparks, but each of us is a fire bigger than the whole world.`,
        `What are we?`
      ],
      options: [
        { label: `Fireflies`, hint: `Blink giggles. “Not me! I show up better in the dark, but I am tiny up close too. And my light is not a fire.” Try again!` },
        { label: `The windows of a faraway town`, hint: `Faraway windows do look like little sparks at night. But a window is not a fire bigger than the world. Try again!` },
        { label: `Stars`, correct: true },
        { label: `Snowflakes`, hint: `Snowflakes are cold and little. But they really are little. These things only look small because they are very far away. Try again!` }
      ],
      after: [
        `You lie down in the clover next to her and look up. Ella and Sharky look up too.`,
        `“Stars!” you say.`,
        `“Yes,” says the hare. “Each star is a giant ball of fire. They only look small because they are so very far away. In the daytime they are still up there. The sun is just too bright for us to see them.”`,
        `“The sun is a star too,” she adds. “It is only the closest one.”`,
        `She points one long ear down the far side of the hill. “Follow the path into the brambles. Mind the weaver. She is fussy about her work.”`
      ]
    },
    choices: [{ label: `Go down into the brambles`, to: `web` }]
  },

  log: {
    place: `The Hollow Log`,
    text: [
      `The Hollow Log is as wide as a tunnel, and very long. Inside it is as dark as a pocket.`,
      `You hold Ella and Sharky tight. Blink’s little light is almost gone. Dry leaves crunch under your slippers.`,
      `Then you see a warm glow ahead. It is a hedgehog, holding a tiny lantern on a stick.`,
      `“Mind your step,” he says. “There are roots. I will light your way to the end of the log. But first, answer me this.”`
    ],
    riddle: {
      lines: [
        `I am joined to your feet, but you can never step on my head.`,
        `Lift the lantern high, and I shrink.`,
        `Set the lantern on the ground, and I stretch out long.`,
        `Blow the lantern out, and I am gone.`,
        `What am I?`
      ],
      options: [
        { label: `Your reflection`, hint: `Your reflection lives in mirrors and in still water. There is no mirror in this log. Try again!` },
        { label: `Your footprints`, hint: `Footprints are made by your feet. But they stay behind when you walk away, and they do not need a lantern. Try again!` },
        { label: `An echo`, hint: `An echo is a sound. Moving a lantern up and down cannot make a sound longer or shorter. Try again!` },
        { label: `Your shadow`, correct: true }
      ],
      after: [
        `“May I hold the lantern?” you ask. The hedgehog hands it over.`,
        `You lift it high. A short dark shape huddles at your feet. You set it on the ground. The dark shape shoots all the way down the log.`,
        `“My shadow!” you say.`,
        `“Right you are,” says the hedgehog. “No light, no shadow. Low light, long shadow.”`,
        `You wiggle Ella’s trunk. A giant dark trunk wiggles on the wall. Sharky’s shadow has very big teeth.`,
        `The hedgehog leads you through to the far end. “Out here and into the brambles,” he says. “Mind the weaver. She is fussy about her work.”`
      ]
    },
    choices: [{ label: `Walk into the brambles`, to: `web` }]
  },

  web: {
    place: `The Bramble Arch`,
    text: [
      `The path dips into a thicket of brambles. The branches bend over your head and make an arch.`,

      options: [

        no(`A clock`, 'clock', `The wheels inside a clock have teeth, and they turn. Good thinking! But a locked door does not listen to a clock.`),
        ok(`A key`, 'key'),
        no(`A bell`, 'bell', `A door may have a bell. But a bell has no teeth, and it does not turn.`) ],
      after: [`“A key!” you say. There it is, on a little hook under the ivy. You turn it. <i>Click.</i>`, `“Slow and steady,” says the snail. “That is how to win a maze.”`] } },
  { id: 'c2_2', place: 'The First Hedges', go: 'Walk on', text: [
    `Green walls rise up on every side. Blink zips ahead and then zips right back.`,
    `“Three baby glowworms wandered in here looking for Grandma’s glasses,” he says. “Can you pick them up on the way through?”` ],
    maze: { w: 5, h: 5, seed: 11, kind: 'plain', theme: 'hedge', after: [`You come out the far side of the hedges. The baby glowworms ride on Ella’s back.`] } },
  { id: 'c2_3', place: 'The Carrot Patch', text: [
    `A field mouse in a straw hat is counting on her paws.`,
    `“Oh, whiskers,” she says. “I planted 4 rows of carrots. Each row had 3 carrots. Then a rabbit ate 5 of them. How many do I have left? Tell me, and I will show you the way on.”` ],
    riddle: { lines: [`4 rows of carrots.`, `3 carrots in each row.`, `A rabbit ate 5.`, `How many carrots are left?`],
      options: [
        no(`5`, 'num:5', `Five is how many the rabbit ate. How many did she plant first?`),
        ok(`7`, 'num:7'),
        no(`9`, 'num:9', `Count the rows again. 3 and 3 and 3 and 3 makes 12. Then take away 5.`),
        no(`12`, 'num:12', `Twelve is how many she planted. Now take away the 5 that the rabbit ate.`) ],
      after: [`“Three and three and three and three is 12,” you say. “Take away 5. That leaves 7.”`, `“Seven!” says the mouse. “Enough for soup.”`, `“The inner gate is locked,” she adds. “The gardener hides the key along one of these two paths. One is narrow and twisty. One is wide and long.”`] },
    ask: `Which path do you take?`, choices: [{ label: `Take the Twisty Path`, to: 'c2_4a' }, { label: `Take the Long Walk`, to: 'c2_4b' }] },
  { id: 'c2_4a', place: 'The Twisty Path', to: 'c2_5', go: 'Go through the inner gate', text: [`The hedges squeeze in close. Somewhere in here is the key to the inner gate.`],
    maze: { w: 6, h: 6, seed: 23, kind: 'key', theme: 'hedge', after: [`The key turns in the inner gate. You are nearly at the middle of the maze.`] } },
  { id: 'c2_4b', place: 'The Long Walk', go: 'Go through the inner gate', text: [`The path is wide here, but it goes on and on. Somewhere along it is the key to the inner gate.`],
    maze: { w: 8, h: 5, seed: 29, kind: 'key', theme: 'hedge', after: [`The key turns in the inner gate. You are nearly at the middle of the maze.`] } },
  { id: 'c2_5', place: 'The Stone Garden', go: 'Walk on', text: [
    `In a little square stands a stone table with a metal fin on top. Numbers are carved around its edge. A sleepy tortoise is leaning on it.`,
    `“Nobody looks at this old thing at night,” he says. “Can you guess why?”` ],
    riddle: { lines: [`I tell the time, but I have no hands and I never tick.`, `My only moving part is a shadow.`, `At night, I am no use at all.`, `What am I?`],
      options: [
        no(`A clock`, 'clock', `A clock tells the time. But it has hands, and it ticks all night long.`),
        no(`A shadow`, 'shadow', `A shadow is the moving part. But a shadow by itself cannot tell you the time.`),
        no(`The moon`, 'moon', `The moon is out at night. This thing is no use at night.`),
        ok(`A sundial`, 'sundial') ],
      after: [`“A sundial!” you say. “The sun makes a shadow, and the shadow points at the hour.”`, `“And no sun, no time,” says the tortoise. “That is why I nap here.”`] } },
  { id: 'c2_6', place: 'The Gnome’s Bench', go: 'Look in the flower bed', text: [
    `A garden gnome sits on a bench with twelve cards face down.`,
    `“I saw something shiny tonight,” he says. “I will tell you where, if you can match all my pairs.”` ],
    memory: { icons: ['mushroom', 'acorn', 'rose', 'snail', 'key', 'web'], after: [`“Well matched,” says the gnome. “The shiny thing is in the flower bed. Look for the pattern.”`] } },
  { id: 'c2_7', place: 'The Flower Bed', go: 'Go to the middle of the maze', text: [
    `The flower bed is planted in a pattern: a rose, then two seeds still waiting to grow, over and over. The last spot is covered by a big leaf.` ],
    riddle: { seq: ['rose', 'seed', 'seed', 'rose', 'seed', 'seed', 'rose', 'seed'], lines: [`Look at the row.`, `What is under the leaf in the last spot?`],
      options: [
        no(`A rose`, 'rose', `After each rose come two seeds. Only one seed has come so far.`),
        ok(`A seed`, 'seed'),
        no(`An acorn`, 'acorn', `There are no acorns in this pattern.`),
        no(`A mushroom`, 'mushroom', `There are no mushrooms in this pattern.`) ],
      after: [`You lift the leaf. Under it is a seed. And next to the seed lies a little empty glasses case.`, `“That is hers!” says Blink. “The glasses must be close.”`] } },
  { id: 'c2_8', place: 'The Middle of the Maze', ending: true, text: [
    `In the very middle of the maze stands a scarecrow. He is wearing a straw hat, an old coat, and something that does not belong to him.`,
    `“I will give them back,” says the scarecrow. “I only wanted to see the stars better. But first, tell me what they are.”` ],
    riddle: { lines: [`I have two windows, but no walls.`, `I sit on a nose and hold on to two ears.`, `Look through me, and blurry things turn clear.`, `What am I?`],
      options: [
        no(`The windows of a house`, 'windows', `Windows belong in walls. These two windows sit on a nose.`),
        ok(`A pair of glasses`, 'glasses'),
        no(`Your eyes`, 'blink', `Your eyes do the looking. But they do not sit on your nose or hold on to your ears.`),
        no(`A book`, 'book', `Grandma Glow reads books. But a book has no windows, and it does not sit on a nose.`) ],
      after: [`“Glasses!” you say.`, `The scarecrow hands them down. Blink flies them straight to Grandma Glow.`, `She puts them on. “Ah,” she says. “There you are, Maven. And Ella. And Sharky. Now, who wants a story?”`, `You listen to one story with the baby glowworms. Then the fireflies carry you home to bed. Ella and Sharky are already asleep.`] } }
] });

/* ---------------- Chapter 3 ---------------- */
addChapter({ id: 'c3', title: 'The Deep Blue Pond', blurb: 'Dive with Sharky to save the Pearl Lamp.', art: 'deep', nodes: [
  { id: 'c3_0', place: 'Your bedroom', art: 'bedroom', go: 'Dive into the pond', text: [
    `<i>Tap. Tap. Tap.</i> Blink is back, and he is dripping wet.`,
    `“The Pearl Lamp has rolled into the deep end of the pond,” he says. “It is the night-light for all the baby fish. They cannot sleep without it. I cannot swim. But I know someone who can.”`,
    `You look at Sharky. Sharky looks very brave.`,
    `At the edge of the pond, an old frog blows a bubble as big as a room. You step inside with Ella and Blink. Sharky swims beside you with a happy flick of the tail. Down you go.` ] },
  { id: 'c3_1', place: 'Under the Lily Pads', go: 'Swim into the reeds', text: [
    `Little silver balls drift up past you. A water beetle rows over.`,
    `“New down here?” he says. “Then tell me what those are.”` ],
    riddle: { lines: [`I am round, and I am made of air inside a thin wet skin.`, `I always travel up, never down.`, `Touch me, and I am gone.`, `What am I?`],
      options: [
        no(`A balloon`, 'balloon', `A balloon is round and full of air. But its skin is dry rubber, and one touch does not end it.`),
        no(`A raindrop`, 'drop', `A raindrop is round and wet. But it travels down, not up.`),
        ok(`A bubble`, 'bubble'),
        no(`An egg`, 'egg', `An egg has a thin shell. But it is not full of air, and it does not float up.`) ],
      after: [`“A bubble!” you say. “We are riding in one.”`, `“So you are,” says the beetle. “Mind the reeds. They are a maze down here.”`] } },
  { id: 'c3_2', place: 'The Reed Forest', go: 'Swim on', text: [
    `Tall reeds grow up from the mud like the bars of a cage. Sharky swims ahead to find the way.`,
    `Three baby fish are lost in here, each with a tiny light.` ],
    maze: { w: 6, h: 6, seed: 31, kind: 'plain', theme: 'water', after: [`Out of the reeds! The baby fish follow Sharky in a neat little line.`] } },
  { id: 'c3_3', place: 'The Fish School', go: 'Swim down to the sunken log', text: [
    `A whole school of fish swims by. Their teacher, a carp with tiny glasses, is counting.`,
    `“Twenty fish in my class,” she says. “Half of them turned left at the rock. Three of those hid in the weeds. How many of the left-turners can I still see?”` ],
    riddle: { lines: [`20 fish in the class.`, `Half of them turn left.`, `3 of the left-turners hide.`, `How many left-turners can she still see?`],
      options: [
        ok(`7`, 'num:7'),
        no(`10`, 'num:10', `Ten fish turned left. But 3 of them hid.`),
        no(`13`, 'num:13', `Half of 20 is 10. Take 3 away from 10. Do not add.`),
        no(`17`, 'num:17', `Only half the class turned left. Start with half of 20.`) ],
      after: [`“Half of 20 is 10,” you say. “Take away 3. Seven!”`, `“Seven. Thank you,” says the carp. “Class, say thank you.” The whole school blows bubbles at you.`] } },
  { id: 'c3_4', place: 'The Sunken Log', text: [
    `On a sunken log sits something small and green, kicking its legs.`,
    `“I was not always like this,” it says. “Guess what I am, and I will tell you where the lamp rolled.”` ],
    riddle: { lines: [`When I was a baby, I had a tail and no legs.`, `Now I have legs and no tail.`, `I began my life under the water, and now I can hop out of it.`, `What am I?`],
      options: [
        no(`A fish`, 'fish', `A fish begins life under the water. But it keeps its tail and never grows legs.`),
        no(`A turtle`, 'turtle', `A turtle has legs from the day it hatches. And it keeps its little tail.`),
        no(`A butterfly`, 'butterfly', `A butterfly changes a lot as it grows. But it was never a baby under the water.`),
        ok(`A frog`, 'frog') ],
      after: [`“A frog!” you say. “You used to be a tadpole.”`, `“I did,” says the frog. “The lamp rolled down into the Dark Deep. Two ways go down. Pick one.”`] },
    ask: `Which way do you go down?`, choices: [{ label: `Swim down the Narrow Crack`, to: 'c3_5a' }, { label: `Swim down the Wide Cave`, to: 'c3_5b' }] },
  { id: 'c3_5a', place: 'The Narrow Crack', to: 'c3_6', go: 'Swim toward the glow', text: [`It is black down here. Blink presses against the wall of the bubble. His light shows only a little way ahead.`],
    maze: { w: 6, h: 6, seed: 37, kind: 'fog', theme: 'water', after: [`A soft glow shines ahead. You are nearly there.`] } },
  { id: 'c3_5b', place: 'The Wide Cave', go: 'Swim toward the glow', text: [`It is black down here. Blink presses against the wall of the bubble. His light shows only a little way ahead.`],
    maze: { w: 7, h: 6, seed: 41, kind: 'fog', theme: 'water', after: [`A soft glow shines ahead. You are nearly there.`] } },
  { id: 'c3_6', place: 'The Shell Path', go: 'Follow the shells', text: [
    `Shells lie in a row on the sand. Each one has a number scratched on it. The last shell is turned over.` ],
    riddle: { seq: ['num:1', 'num:2', 'num:4', 'num:8'], lines: [`1, 2, 4, 8 ...`, `What number is on the last shell?`],
      options: [
        no(`9`, 'num:9', `The numbers do not go up by ones. Each number is double the one before.`),
        no(`10`, 'num:10', `From 4 to 8 is not plus 2. Each number is double the one before.`),
        no(`12`, 'num:12', `Each number is double the one before. Double 8 is not 12.`),
        ok(`16`, 'num:16') ],
      after: [`“Each one is double the one before,” you say. “Double 8 is 16!”`, `The last shell flips over by itself. Sixteen.`] } },
  { id: 'c3_7', place: 'The Four Gems', go: 'Carry the lamp back up', text: [
    `Four gems sit in a row on the pond floor. From left to right, they are red, white, blue, and gold.`,
    `A crayfish taps his claw. “The Pearl Lamp is buried under one of them. I will give you two clues.”` ],
    riddle: { lines: [`Clue one: it is somewhere to the left of the blue gem.`, `Clue two: it is not under the red gem.`, `Which gem do you dig under?`],
      options: [
        no(`The red gem`, 'gem:red', `The red gem is to the left of the blue one. But clue two says it is not the red gem.`),
        ok(`The white gem`, 'gem:white'),
        no(`The blue gem`, 'gem:blue', `The lamp is to the left of the blue gem, not under it.`),
        no(`The gold gem`, 'gem:gold', `The gold gem is to the right of the blue gem. Clue one says left.`) ],
      after: [`Red and white are to the left of blue. It is not red. So it must be white.`, `Sharky digs nose-first. Something round and bright rolls out of the sand. The Pearl Lamp!`] } },
  { id: 'c3_8', place: 'The Catfish’s Cave', ending: true, text: [
    `A huge old catfish blocks the way back up. His whiskers are as long as your arm.`,
    `“You may take the lamp,” he rumbles, “if you can name the thing that is all around you.”` ],
    riddle: { lines: [`I have no color, but I can look blue.`, `I have no shape of my own. I take the shape of whatever holds me.`, `You are inside me right now, and you drink me every day.`, `What am I?`],
      options: [
        no(`Air`, 'breath', `Air has no color and no shape. But you breathe air. You do not drink it.`),
        no(`A shadow`, 'shadow', `A shadow has no color of its own. But you cannot drink a shadow.`),
        ok(`Water`, 'drop'),
        no(`A bubble`, 'bubble', `You are inside a bubble. But a bubble has its own round shape, and you do not drink it.`) ],
      after: [`“Water!” you say.`, `“Water,” says the catfish, and he moves aside.`, `Sharky carries the Pearl Lamp up, very gently, between two rows of teeth, and sets it back on its rock. All over the pond, baby fish close their eyes.`, `The big bubble floats you to the top and pops. Soon you are home in bed, a little damp. Sharky sleeps with a big toothy smile.`] } }
] });

/* ---------------- Chapter 4 ---------------- */
addChapter({ id: 'c4', title: 'The Mole Tunnels', blurb: 'Hunt for the Glow Seed in the dark.', art: 'tunnels', nodes: [
  { id: 'c4_0', place: 'Your bedroom', art: 'bedroom', go: 'Slide down the hole', text: [
    `<i>Tap. Tap. Tap.</i> Blink is at the window. Beside him on the sill sits a mole with dirt on her nose.`,
    `“This is Moss,” says Blink. “The Glow Seed has fallen down her tunnels. It is the seed of the next Lantern Tree. If we do not find it, there will never be a new tree.”`,
    `“It is very dark down there,” says Moss. “I do not mind. I cannot see much anyway. But you will need your firefly.”`,
    `You, Ella, and Sharky follow her to a hole under the old apple tree. Down you slide.` ] },
  { id: 'c4_1', place: 'Under the Apple Tree', go: 'Follow Moss', text: [
    `Thick brown ropes hang down from the roof of the tunnel. Moss pats one.`,
    `“Mind your head,” she says. “Do you know what these are?”` ],
    riddle: { lines: [`I am the part of a tree that never sees the sun.`, `I drink all day, but I have no mouth.`, `The tree stands tall only because I hold on tight in the dark.`, `What am I?`],
      options: [
        no(`A worm`, 'worm', `A worm lives in the dark. But a worm has a mouth, and it does not hold up a tree.`),
        ok(`Roots`, 'roots'),
        no(`An acorn`, 'acorn', `An acorn can become a tree. But it does not drink all day or hold on tight.`),
        no(`A mushroom`, 'mushroom', `A mushroom grows in dark places. But it is not part of a tree, and it does not hold one up.`) ],
      after: [`“Roots!” you say.`, `“Roots,” says Moss. “I use them like street signs. Left at the big one.”`] } },
  { id: 'c4_2', place: 'The Dark Tunnels', go: 'Walk on', text: [
    `The tunnels twist every which way. Blink’s light shows only the walls right beside you.`,
    `Three glow pebbles mark Moss’s favorite spots.` ],
    maze: { w: 6, h: 6, seed: 43, kind: 'fog', theme: 'earth', after: [`“You pick a good path,” says Moss. That is a big thing for a mole to say.`] } },
  { id: 'c4_3', place: 'The Pantry', go: 'Walk on', text: [
    `Moss stops at a little room full of jars.`,
    `“I must count my tunnels,” she says. “I dug 3 on Monday. On Tuesday I dug twice as many as Monday. On Wednesday I was tired, and I dug only 1.”` ],
    riddle: { lines: [`3 tunnels on Monday.`, `Twice as many on Tuesday.`, `1 on Wednesday.`, `How many tunnels in all?`],
      options: [
        no(`7`, 'num:7', `Tuesday was twice as many as Monday. Twice 3 is 6, not 3.`),
        no(`9`, 'num:9', `Do not forget the one tunnel on Wednesday.`),
        ok(`10`, 'num:10'),
        no(`12`, 'num:12', `Twice 3 is 6. Now add 3, and 6, and 1.`) ],
      after: [`“Three, and six, and one,” you say. “Ten tunnels!”`, `“Ten,” says Moss. “No wonder my paws are sore.”`] } },
  { id: 'c4_4', place: 'The Gem Room', go: 'Go deeper', text: [
    `The next room sparkles. Twelve flat stones lie face down on the floor.`,
    `“My matching game,” says Moss. “I play by smell. You may use your eyes.”` ],
    memory: { icons: ['gem:red', 'gem:blue', 'gem:green', 'worm', 'acorn', 'mushroom'], after: [`“All matched,” says Moss. “Now I trust you with the deep tunnels.”`] } },
  { id: 'c4_5', place: 'The Root Cellar', text: [
    `Orange points poke down through the roof like a row of teeth. A fat grub is nibbling one.`,
    `“Shh,” he says. “Do not tell the gardener. Do you know what I am eating?”` ],
    riddle: { lines: [`I grow down into the dark while my green hair grows up into the light.`, `I am orange, but I have never seen the sun.`, `To pick me, you pull me up by my hair.`, `What am I?`],
      options: [
        ok(`A carrot`, 'carrot'),
        no(`Tree roots`, 'roots', `Roots grow down in the dark. But they are not orange, and nobody picks them.`),
        no(`A mushroom`, 'mushroom', `A mushroom has no green hair.`),
        no(`A flame`, 'flame', `A flame is orange. But it does not grow in the ground, and you cannot pull it up.`) ],
      after: [`“A carrot!” you say.`, `The grub points with his tail. “A shiny seed? It rolled down past the crystals. There are two ways. Both are locked by an old iron grate.”`] },
    ask: `Which tunnel do you take?`, choices: [{ label: `Take the Low Tunnel`, to: 'c4_6a' }, { label: `Take the High Tunnel`, to: 'c4_6b' }] },
  { id: 'c4_6a', place: 'The Low Tunnel', to: 'c4_7', go: 'Go through the grate', text: [`Crystals glow in the walls, so you can see the whole cavern. The key to the grate is somewhere in here.`],
    maze: { w: 7, h: 7, seed: 47, kind: 'key', theme: 'crystal', after: [`The grate swings open. Something is glowing green at the end of the tunnel.`] } },
  { id: 'c4_6b', place: 'The High Tunnel', go: 'Go through the grate', text: [`Crystals glow in the walls, so you can see the whole cavern. The key to the grate is somewhere in here.`],
    maze: { w: 8, h: 6, seed: 53, kind: 'key', theme: 'crystal', after: [`The grate swings open. Something is glowing green at the end of the tunnel.`] } },
  { id: 'c4_7', place: 'The Crystal Row', go: 'Step through the stone door', text: [
    `A row of crystals is set into the wall. One is missing.`,
    `“Put the right one in,” says Moss, “and the last door opens.”` ],
    riddle: { seq: ['gem:red', 'gem:blue', 'gem:blue', 'gem:green', 'gem:red', 'gem:blue', 'gem:blue', 'gem:green', 'gem:red', 'gem:blue', 'gem:blue'], lines: [`Look at the row.`, `Which crystal is missing from the end?`],
      options: [
        no(`Red`, 'gem:red', `Red comes after green, not after two blues.`),
        no(`Blue`, 'gem:blue', `There are only two blues in a row, and both are already here.`),
        ok(`Green`, 'gem:green'),
        no(`Gold`, 'gem:gold', `There is no gold in this pattern.`) ],
      after: [`Red, blue, blue, green, over and over. So green comes next! You press the green crystal in. The stone door rolls aside.`] } },
  { id: 'c4_8', place: 'The Deepest Room', ending: true, text: [
    `There it is. The Glow Seed sits on a little hill of dirt, shining soft green. But an old badger is curled around it, half asleep.`,
    `“One riddle, and it is yours,” he mumbles. “You have been walking in the answer all night.”` ],
    riddle: { lines: [`I am a road with a roof.`, `I have two mouths, but I never eat.`, `Go in one mouth in the dark, and come out the other into the light.`, `What am I?`],
      options: [
        no(`A bridge`, 'bridge', `A bridge is a road. But it has no roof and no mouths.`),
        no(`A bird cage`, 'cage', `A cage has a roof. But it is not a road, and you cannot walk through it.`),
        no(`A boat`, 'boat', `A boat can carry you. But it has no roof and no mouths.`),
        ok(`A tunnel`, 'tunnel') ],
      after: [`“A tunnel!” you say.`, `The badger yawns and rolls over. Ella lifts the Glow Seed with one careful trunk. It is warm.`, `Moss leads you up, up, up, and out under the stars. Grandma Glow plants the seed beside the Lantern Tree and pats the dirt down.`, `“Come back in a hundred years,” she says. “It will be taller than a house.”`, `Then it is home to bed, with dirt on your slippers.`] } }
] });

/* ---------------- Chapter 5 ---------------- */
addChapter({ id: 'c5', title: 'The Cloud Castle', blurb: 'Fly up on Ella’s ears to rescue a baby cloud.', art: 'clouds', nodes: [
  { id: 'c5_0', place: 'Your bedroom', art: 'bedroom', go: 'Fly up to the castle', text: [
    `<i>Tap. Tap. Tap.</i> Blink is at the window, pointing up.`,
    `“A baby cloud named Puff has blown away from her flock,” he says. “She is stuck on the weathervane on top of the Cloud Castle. If she is not home by morning, the meadow will have no shade.”`,
    `“How do we get up there?” you ask.`,
    `Blink looks at Ella. “Those are very big ears,” he says. “And tonight there is a very big wind.”`,
    `You hold on tight. Ella spreads two big ears like gray sails. Sharky holds on to your pajamas. Up you go!` ] },
  { id: 'c5_1', place: 'The Windy Stairs', go: 'Climb into the castle', text: [
    `You land on a stair made of cloud. Something pushes you from behind. Something whistles in your ear. But nobody is there.`,
    `“Guess who,” says a voice like a long breath.` ],
    riddle: { lines: [`I have no hands, but I can take your hat.`, `I have no feet, but I can run across a field, and you can watch the grass bend where I go.`, `You can feel me and hear me, but you can never see me.`, `What am I?`],
      options: [
        no(`An echo`, 'echo', `You can hear an echo and never see it. But an echo cannot take your hat.`),
        no(`A shadow`, 'shadow', `A shadow has no hands and no feet. But you can see it, and it makes no sound.`),
        ok(`The wind`, 'breath'),
        no(`A runaway balloon`, 'balloon', `A balloon can run away across a field. But you can see it go.`) ],
      after: [`“The wind!” you say.`, `“Whoo,” laughs the wind, and it gives you a push up the stairs.`] } },
  { id: 'c5_2', place: 'The Cloud Halls', go: 'Step out on the balcony', text: [
    `Inside the castle, the walls are fog and the floors are mist.`,
    `Three sparks of starlight are scattered in the halls.` ],
    maze: { w: 7, h: 7, seed: 59, kind: 'plain', theme: 'cloud', after: [`You step out onto a balcony. The whole world is far below, small and soft.`] } },
  { id: 'c5_3', place: 'The Bird Wire', go: 'Go to the next room', text: [
    `A silver wire runs from tower to tower. A row of sparrows sits on it. The littlest one is trying to count.`,
    `“Nine of us sat here,” she says. “Four flew off. Then two came back, and each one brought a friend. How many of us now?”` ],
    riddle: { lines: [`9 birds on the wire.`, `4 fly away.`, `2 come back, each with 1 friend.`, `How many birds are on the wire now?`],
      options: [
        no(`7`, 'num:7', `Two came back, and each brought a friend. That is 4 birds landing, not 2.`),
        no(`8`, 'num:8', `Count the friends too. Two birds and two friends is 4 birds landing.`),
        ok(`9`, 'num:9'),
        no(`11`, 'num:11', `Do not forget the 4 that flew away at the start.`) ],
      after: [`“Nine take away 4 is 5,” you say. “Then 2 birds and 2 friends land. Nine again!”`, `“Nine! The same as before!” The sparrows think this is the best joke they have ever heard.`] } },
  { id: 'c5_4', place: 'The Kite Room', text: [
    `In the next room, bright shapes bob against the ceiling, each one tied down with string. A heron in a blue cap is the keeper.`,
    `“Name one of these,” he says, “and you may borrow it.”` ],
    riddle: { lines: [`I fly, but I am not alive.`, `I have a tail, but I am not an animal.`, `The harder the wind pulls me away, the tighter someone holds my string.`, `What am I?`],
      options: [
        no(`A balloon`, 'balloon', `A balloon flies on a string. But it has no tail, and it does not need the wind.`),
        no(`A parrot`, 'parrot', `A parrot flies and has a tail. But a parrot is alive.`),
        ok(`A kite`, 'kite'),
        no(`A cloud`, 'cloud', `A cloud flies and is not alive. But nobody holds a cloud on a string.`) ],
      after: [`“A kite!” you say.`, `“Take the red one,” says the heron. “You will need it. The top of the castle is across the Sky Maze. Two doors lead in.”`] },
    ask: `Which door do you take?`, choices: [{ label: `Go through the Sun Door`, to: 'c5_5a' }, { label: `Go through the Rain Door`, to: 'c5_5b' }] },
  { id: 'c5_5a', place: 'The Sun Door', to: 'c5_6', go: 'Ride the kite up', text: [`The Sky Maze is made of thin gold mist. Hold on to the kite string, and do not look down.`],
    maze: { w: 7, h: 7, seed: 61, kind: 'plain', theme: 'cloud', after: [`The wind lifts the kite, and the kite lifts you, right up to the top of the tower.`] } },
  { id: 'c5_5b', place: 'The Rain Door', go: 'Ride the kite up', text: [`The Sky Maze is made of thin gray mist. Hold on to the kite string, and do not look down.`],
    maze: { w: 9, h: 6, seed: 67, kind: 'plain', theme: 'cloud', after: [`The wind lifts the kite, and the kite lifts you, right up to the top of the tower.`] } },
  { id: 'c5_6', place: 'The Weather Clock', go: 'Climb through the hatch', text: [
    `A great dial hangs on the tower wall, with numbers that count down. The last number has blown away.` ],
    riddle: { seq: ['num:20', 'num:17', 'num:14', 'num:11'], lines: [`20, 17, 14, 11 ...`, `What number comes next?`],
      options: [
        no(`10`, 'num:10', `The numbers do not go down by ones. Look at the jump from 20 to 17.`),
        no(`9`, 'num:9', `From 20 to 17 is 3. From 17 to 14 is 3. Take 3 from 11.`),
        ok(`8`, 'num:8'),
        no(`7`, 'num:7', `That is 4 less than 11. Each jump is only 3.`) ],
      after: [`“Each one is 3 less,” you say. “Eleven take away 3 is 8.”`, `You chalk an 8 on the dial. A hatch opens above you.`] } },
  { id: 'c5_7', place: 'The Racing Birds', go: 'Climb to the weathervane', text: [
    `Four birds have been racing around the tower all night: Jay, Dove, Wren, and Owl. Now they are arguing about who came second.` ],
    riddle: { lines: [`Jay finished before Dove.`, `Wren finished after Dove.`, `Owl finished last of all.`, `Who came second?`],
      options: [
        no(`Jay`, 'let:J', `Jay finished before Dove, and Dove was before Wren. So Jay was first, not second.`),
        ok(`Dove`, 'let:D'),
        no(`Wren`, 'let:W', `Wren finished after Dove. So Dove was ahead of Wren.`),
        no(`Owl`, 'let:O', `Owl finished last of all.`) ],
      after: [`“Jay, then Dove, then Wren, then Owl,” you say. “Dove was second!”`, `Dove bows. Owl says he was only resting his eyes.`] } },
  { id: 'c5_8', place: 'The Weathervane', ending: true, text: [
    `At the very top, a small white shape is snagged on the golden weathervane, sniffling. The weathervane is a rooster, and he is cross.`,
    `“I will let her go when someone tells me what she IS,” he says. “I have been asking all night.”` ],
    riddle: { lines: [`I can be white as wool or gray as a mouse.`, `I am heavier than an elephant, but I float.`, `I can hide the sun. And when I cry, the garden drinks.`, `What am I?`],
      options: [
        no(`A pillow`, 'pillow', `A pillow is white and soft. But it does not float, and it cannot hide the sun.`),
        no(`Snow`, 'snow', `Snow is white. But it falls down. It does not float in the sky.`),
        no(`A balloon`, 'balloon', `A balloon floats. But it is light, not heavy, and it does not cry.`),
        ok(`A cloud`, 'cloud') ],
      after: [`“A cloud!” you say.`, `“Hmph. Obviously,” says the rooster. He lifts one golden wing, and Puff floats free.`, `She is so happy that she rains on you a little. Ella does not like getting wet, but tonight Ella lets it go.`, `Puff carries all of you home on her back. It is like riding a very soft, very slow pillow. You are asleep before you land.`] } }
] });

/* ---------------- Chapter 6 ---------------- */
addChapter({ id: 'c6', title: 'The Snowy Mountain', blurb: 'Find the Ice Bell and relight the Northern Lights.', art: 'snowy', nodes: [
  { id: 'c6_0', place: 'Your bedroom', art: 'bedroom', go: 'Ride up the mountain', text: [
    `<i>Tap. Tap. Tap.</i> There is frost on the window tonight. Blink is wearing a tiny scarf.`,
    `“The Northern Lights have gone out,” he says. “They are the night-light for the whole top of the world. The Light Keeper says her Ice Bell is missing. Without it, she cannot ring them back on.”`,
    `You put on your warmest robe. Ella gets a sock for a hat. Sharky gets a mitten for a sleeping bag.`,
    `A sled is waiting in the yard, pulled by six snow hares. Away you go, up the mountain.` ] },
  { id: 'c6_1', place: 'The Falling Snow', go: 'Ride on', text: [
    `White specks drift down all around the sled. One lands on your nose. A snow hare looks back at you.`,
    `“First mountain riddle,” she says. “What just landed on you?”` ],
    riddle: { lines: [`I fall a very long way, but I never get hurt.`, `I have six arms, and no two of us look the same.`, `Catch me on your tongue, and I am only a drop of water.`, `What am I?`],
      options: [
        no(`A raindrop`, 'drop', `A raindrop falls a long way. But it has no arms, and raindrops all look alike.`),
        no(`A star`, 'star', `A star has points. But it does not land on your tongue.`),
        ok(`A snowflake`, 'snow'),
        no(`A spider`, 'web', `A spider has eight legs, not six arms. And please do not catch one on your tongue.`) ],
      after: [`“A snowflake!” you say, and you catch one.`, `“Six arms, every time,” says the hare. “Count them if you do not believe me.”`] } },
  { id: 'c6_2', place: 'The Ice Maze', go: 'Slide on', text: [
    `The sled stops at a wall of blue ice. The only way on is through.`,
    `Three lost sparks of the Northern Lights flicker inside.` ],
    maze: { w: 7, h: 7, seed: 71, kind: 'plain', theme: 'ice', after: [`You slide out the far side on your slippers. <i>Wheee.</i>`] } },
  { id: 'c6_3', place: 'The Fox Den', go: 'Warm up inside', text: [
    `Four fox cubs tumble out of a snowy den. Their mother is counting boots.`,
    `“Four cubs,” she says. “Four paws each. One boot for every paw. But three boots are lost in the snow. How many boots do we still have?”` ],
    riddle: { lines: [`4 fox cubs.`, `4 boots for each cub.`, `3 boots are lost.`, `How many boots are left?`],
      options: [
        no(`11`, 'num:11', `Count 4 and 4 and 4 and 4. Then take away 3.`),
        no(`12`, 'num:12', `Four cubs with four boots each is 16. Then take away 3.`),
        ok(`13`, 'num:13'),
        no(`16`, 'num:16', `Sixteen is how many boots they started with. Now take away the 3 lost ones.`) ],
      after: [`“Four fours are 16,” you say. “Take away 3. Thirteen boots.”`, `“Thirteen,” sighs the mother fox. “Somebody is going to hop.”`] } },
  { id: 'c6_4', place: 'The Warm Cave', go: 'Go back out', text: [
    `The foxes invite you in to warm up. On the floor are twelve chips of ice with pictures scratched underneath.`,
    `“It is our matching game,” says the smallest cub. “Nobody has ever finished it.”` ],
    memory: { icons: ['snow', 'drop', 'star', 'moon', 'bell', 'flame'], after: [`You are warm again, and the cubs have seen how the game is done.`] } },
  { id: 'c6_5', place: 'The Frozen Lake', text: [
    `The path crosses a wide, flat lake. It is as hard as a floor and as clear as a window. The otter’s cousin slides past on her belly.`,
    `“Do you know what you are standing on?” she calls.` ],
    riddle: { lines: [`I am water, but you can walk on me.`, `I am as hard as a stone, but I float.`, `Hold me in a warm hand, and I cry myself away.`, `What am I?`],
      options: [
        no(`A stone`, 'stone-gray', `A stone is hard. But a stone sinks, and it is not water.`),
        no(`A bridge`, 'bridge', `You can walk over water on a bridge. But a bridge is not made of water.`),
        ok(`Ice`, 'ice'),
        no(`A bubble`, 'bubble', `A bubble floats. But you cannot walk on a bubble.`) ],
      after: [`“Ice!” you say.`, `“Ice,” she says. “The best thing water ever turned into.”`, `“The Ice Bell is up at the peak,” she calls. “A snowstorm is coming. Two trails go up.”`] },
    ask: `Which trail do you take?`, choices: [{ label: `Take the Pine Trail`, to: 'c6_6a' }, { label: `Take the Rock Trail`, to: 'c6_6b' }] },
  { id: 'c6_6a', place: 'The Pine Trail', to: 'c6_7', go: 'Climb to the peak', text: [`Snow whirls so thick that you can see only a step or two. Stay close to Blink’s light.`],
    maze: { w: 7, h: 7, seed: 73, kind: 'fog', theme: 'ice', after: [`The storm blows itself out. The peak is right above you, sharp against the stars.`] } },
  { id: 'c6_6b', place: 'The Rock Trail', go: 'Climb to the peak', text: [`Snow whirls so thick that you can see only a step or two. Stay close to Blink’s light.`],
    maze: { w: 8, h: 7, seed: 79, kind: 'fog', theme: 'ice', after: [`The storm blows itself out. The peak is right above you, sharp against the stars.`] } },
  { id: 'c6_7', place: 'The Carved Steps', go: 'Take the bell to the Light Keeper', text: [
    `Steps are cut into the rock. Each one has a letter. The top step is covered in snow.` ],
    riddle: { seq: ['let:A', 'let:C', 'let:E', 'let:G'], lines: [`A, C, E, G ...`, `What letter is on the top step?`],
      options: [
        no(`H`, 'let:H', `H comes right after G. But this pattern skips a letter each time.`),
        ok(`I`, 'let:I'),
        no(`J`, 'let:J', `That skips two letters. This pattern skips only one.`),
        no(`K`, 'let:K', `That skips three letters. This pattern skips only one.`) ],
      after: [`“A, skip B. C, skip D. E, skip F. G, skip H,” you say. “It is I!”`, `You brush off the snow. There is the letter I. And beside it, half buried, is a little silver bell made of ice.`] } },
  { id: 'c6_8', place: 'The Peak', ending: true, text: [
    `The Light Keeper is a great white owl. She takes the Ice Bell gently in her beak.`,
    `“You found it,” she says. “One last riddle before I ring it. How will you get home?”` ],
    riddle: { lines: [`I race down the hill, but I must be dragged back up.`, `I have no wheels, no legs, and no engine.`, `The snow is my road. Without it, I only sit.`, `What am I?`],
      options: [
        no(`A boat`, 'boat', `A boat has no wheels and no legs. But its road is water, not snow.`),
        no(`A kite`, 'kite', `A kite has no wheels. But it rides the wind, not the snow.`),
        no(`A snowflake`, 'snow', `A snowflake comes down the hill. But nobody drags it back up.`),
        ok(`A sled`, 'sled') ],
      after: [`“A sled!” you say.`, `“Then hold on,” says the Light Keeper. She rings the Ice Bell. <i>Ting.</i>`, `Green and pink and purple light pours across the sky like spilled paint. All over the top of the world, little animals stop being afraid of the dark.`, `Your sled races all the way home under the lights. You are asleep before it stops.`] } }
] });

/* ---------------- Chapter 7 ---------------- */
addChapter({ id: 'c7', title: 'The Night Market', blurb: 'Earn moon coins for a birthday present.', art: 'market', nodes: [
  { id: 'c7_0', place: 'Your bedroom', art: 'bedroom', go: 'Go to the market', text: [
    `<i>Tap. Tap. Tap.</i> Blink is hopping from foot to foot on the windowsill.`,
    `“Tomorrow is Grandma Glow’s birthday,” he says. “She will be three hundred and one. I want to buy her a present at the Night Market. But the stalls only take moon coins, and you only get moon coins for solving puzzles.”`,
    `“Then you need us,” you say.`,
    `The Night Market is under the old stone bridge. Paper lanterns swing on strings. Every stall has a puzzle and a jar of silver coins.` ] },
  { id: 'c7_1', place: 'The Weighing Stall', go: 'Go to the next stall', text: [
    `A raccoon sells nuts by the scoop. On her counter stands a shiny thing with two little dishes hanging from a bar.`,
    `“One coin if you can name it,” she says.` ],
    riddle: { lines: [`I have two arms and two dishes, but I never eat.`, `I cannot count, but I always know which side is heavier.`, `When both sides are fair, I stand perfectly level.`, `What am I?`],
      options: [
        no(`A clock`, 'clock', `A clock has two hands, not two dishes. And it cannot tell you which side is heavier.`),
        ok(`A scale`, 'scale'),
        no(`A bell`, 'bell', `A bell hangs from a bar. But it has no dishes.`),
        no(`A bridge`, 'bridge', `A bridge stands level. But it has no dishes, and it cannot tell which side is heavier.`) ],
      after: [`“A scale!” you say.`, `“One moon coin,” says the raccoon, and she drops it in your hand. It is cold and bright.`] } },
  { id: 'c7_2', place: 'The Fruit Stall', go: 'Walk into the lanes', text: [
    `A hedgehog sells fruit. “My cousin lives in a log,” he tells you.`,
    `“Apples are 2 coins. Pears are 3 coins. Pretend you have 10 coins, and you buy 2 apples. How many pears can you buy with what is left?”` ],
    riddle: { lines: [`You have 10 coins.`, `Apples cost 2. Pears cost 3.`, `You buy 2 apples.`, `How many pears can you buy with what is left?`],
      options: [
        no(`1`, 'num:1', `You can do better. After the apples you have 6 coins. How many 3s are in 6?`),
        ok(`2`, 'num:2'),
        no(`3`, 'num:3', `Three pears cost 9 coins. After the apples, you have only 6.`),
        no(`4`, 'num:4', `Four pears cost 12 coins. After the apples, you have only 6.`) ],
      after: [`“Two apples cost 4,” you say. “That leaves 6. Two pears cost 6. Two pears!”`, `“Sharp,” says the hedgehog. Another coin. That makes two.`] } },
  { id: 'c7_3', place: 'The Lantern Lanes', go: 'Stop at the bead stall', text: [
    `The market is a maze of stalls and strings of lights.`,
    `Three moon coins are shining on the ground where shoppers dropped them. Finders keepers.` ],
    maze: { w: 8, h: 7, seed: 83, kind: 'plain', theme: 'market', after: [`The coins clink in your pajama pocket.`] } },
  { id: 'c7_4', place: 'The Bead Stall', go: 'Go to the next stall', text: [
    `A spider sells necklaces. Each string has more beads than the last.`,
    `“How many beads go on my next string?” she asks. “Here is a hint. Add.”` ],
    riddle: { seq: ['num:1', 'num:1', 'num:2', 'num:3', 'num:5'], lines: [`1, 1, 2, 3, 5 ...`, `How many beads come next?`],
      options: [
        no(`6`, 'num:6', `The numbers do not go up by ones. Try adding the last two numbers together.`),
        no(`7`, 'num:7', `Close! Add the last two numbers: 3 and 5.`),
        ok(`8`, 'num:8'),
        no(`10`, 'num:10', `Add only the last two numbers: 3 and 5.`) ],
      after: [`“Each number is the two before it, added together,” you say. “3 and 5 is 8!”`, `“Most grown-ups miss that one,” says the spider. She pays you two coins.`] } },
  { id: 'c7_5', place: 'The Rain Stall', text: [
    `<i>Drip. Drip.</i> Rain is coming through the cracks in the bridge. A duck is doing very good business at the next stall.`,
    `“Name what I sell,” she says, “and I will lend you one.”` ],
    riddle: { lines: [`I open when the sky cries, and I close when it stops.`, `I have ribs, but no heart.`, `I keep you dry by getting wet myself.`, `What am I?`],
      options: [
        no(`A cloud`, 'cloud', `A cloud is what makes the sky cry. It does not keep you dry.`),
        no(`A mushroom`, 'mushroom', `A mushroom is the right shape. But it has no ribs, and it does not open and close.`),
        ok(`An umbrella`, 'umbrella'),
        no(`A blanket`, 'blanket', `A blanket covers you. But it has no ribs, and a wet blanket keeps nobody dry.`) ],
      after: [`“An umbrella!” you say.`, `The duck gives you a coin and lends you a big green umbrella. Ella is very glad.`, `“The present stall is behind the night gate,” says the duck. “The watchman hides the key. Go by Spice Row or by Cloth Row.”`] },
    ask: `Which row do you take?`, choices: [{ label: `Go by Spice Row`, to: 'c7_6a' }, { label: `Go by Cloth Row`, to: 'c7_6b' }] },
  { id: 'c7_6a', place: 'Spice Row', to: 'c7_7', go: 'Go through the night gate', text: [`Spice Row smells of pepper and cinnamon. Find the watchman’s key, and pick up any coins you see.`],
    maze: { w: 8, h: 7, seed: 89, kind: 'key', theme: 'market', after: [`The night gate creaks open. You count your coins. Almost enough.`] } },
  { id: 'c7_6b', place: 'Cloth Row', go: 'Go through the night gate', text: [`Cloth Row is hung with flags and scarves. Find the watchman’s key, and pick up any coins you see.`],
    maze: { w: 7, h: 8, seed: 97, kind: 'key', theme: 'market', after: [`The night gate creaks open. You count your coins. Almost enough.`] } },
  { id: 'c7_7', place: 'The Market Bell', go: 'Go to the present stall', text: [
    `A big brass bell hangs in the middle of the market. A sign says:`,
    `<b>RING THE RIGHT NUMBER FOR A PRIZE.</b>` ],
    riddle: { knock: { n: 12, gt: 10, lt: 15, even: true, by: [3], verb: 'Ring', noun: 'Rings', done: 'Done ringing' },
      lines: [`I am more than 10 and less than 15.`, `I am an even number.`, `You say me when you count by threes.`, `What number am I?`],
      options: [ok(`12`, 'num:12')],
      after: [`Only 12 and 14 are even. And counting by threes goes 3, 6, 9, 12. Twelve!`, `<i>Dong. Dong. Dong.</i> Twelve times. The whole market claps. The prize is a fat bag of moon coins.`] } },
  { id: 'c7_8', place: 'The Present Stall', ending: true, text: [
    `The last stall is run by an old toad in a velvet coat. He has music boxes, and silver thimbles, and tiny lanterns. Blink cannot choose.`,
    `“The best present in my stall is not for sale,” says the toad. “Guess it, and take anything else you like.”` ],
    riddle: { lines: [`You can give me away and still keep me.`, `I cost nothing, but I am worth a lot.`, `I am one small curve that changes a whole face.`, `Give me to someone, and you often get one right back.`, `What am I?`],
      options: [
        no(`A secret`, 'secret', `You do still have a secret after you share it. But a secret is not a curve on a face.`),
        no(`A flame`, 'flame', `A flame can be given and kept. Good remembering! But it does not change a face.`),
        no(`A yawn`, 'yawn', `You do often get a yawn right back. But a yawn is a big open circle, not a small curve.`),
        ok(`A smile`, 'smile') ],
      after: [`“A smile!” you say. You are wearing one.`, `The toad gives one right back. “Take the little lantern,” he says. “No charge.”`, `Blink cannot wait until tomorrow. He flies the present straight to the Lantern Tree. Grandma Glow gives him the biggest smile of her three hundred years.`, `You can see it from your bedroom window, all the way across the meadow. Then you fall asleep, smiling too.`] } }
] });

/* ---------------- Chapter 8 ---------------- */
addChapter({ id: 'c8', title: 'The Clock Tower', blurb: 'Wind the Great Clock so morning can come.', art: 'clock', nodes: [
  { id: 'c8_0', place: 'Your bedroom', art: 'bedroom', go: 'Go to the Clock Tower', text: [
    `<i>Tap. Tap. Tap.</i> You look at your clock. It says eight. That is odd. It said eight a long time ago.`,
    `“Every clock has stopped,” says Blink at the window. “The Great Clock in the tower has run down, and all the little clocks follow it. If nobody winds it, morning will never come.”`,
    `“No morning?” you say. “No breakfast?”`,
    `Ella and Sharky agree that this is serious. Off you go to the Clock Tower in the middle of town.` ] },
  { id: 'c8_1', place: 'The Tower Door', go: 'Go inside', text: [
    `A mouse in a waistcoat opens the tower door. He holds up a glass thing with sand inside.`,
    `“I am the Clock Mouse,” he says. “Before you come in, tell me what I use to time my tea.”` ],
    riddle: { lines: [`I have two rooms and one tiny door between them.`, `I am full of sand, but I am not a beach.`, `When my top room is empty, your time is up. Flip me over, and it starts again.`, `What am I?`],
      options: [
        no(`A clock`, 'clock', `A clock tells time. But it has no sand and no rooms.`),
        no(`A sundial`, 'sundial', `A sundial tells time with a shadow, not with sand.`),
        ok(`A sand timer`, 'hourglass'),
        no(`An egg`, 'egg', `You can time an egg with it. But an egg has no sand inside.`) ],
      after: [`“A sand timer!” you say.`, `“Three minutes for tea,” says the Clock Mouse. “Come in. Mind the gears.”`] } },
  { id: 'c8_2', place: 'The Gear Room', go: 'Climb the stairs', text: [
    `The bottom of the tower is packed with wheels and gears, all standing still. You have to squeeze between them.`,
    `Three bright little springs have popped loose. The clock will need them.` ],
    maze: { w: 8, h: 8, seed: 101, kind: 'plain', theme: 'brass', after: [`The springs are safe in your pocket.`] } },
  { id: 'c8_3', place: 'The Sleeping Bells', go: 'Climb higher', text: [
    `Halfway up, a bat hangs beside a row of bells.`,
    `“I ring the hours,” she says. “But I have lost track. When the clock stopped, it was 7 o’clock. Then I napped for 2 hours and ate moths for 1 hour. What time should it be now?”` ],
    riddle: { lines: [`The clock stopped at 7 o’clock.`, `The bat napped for 2 hours.`, `Then she ate for 1 hour.`, `What time should it be?`],
      options: [
        no(`8 o’clock`, 'num:8', `That is only 1 hour after 7. She napped for 2 hours and ate for 1.`),
        no(`9 o’clock`, 'num:9', `That counts her nap. Now add the hour she spent eating.`),
        ok(`10 o’clock`, 'num:10'),
        no(`11 o’clock`, 'num:11', `That is 4 hours after 7. She napped for 2 and ate for 1.`) ],
      after: [`“Seven and 2 is 9. One more is 10,” you say. “It should be 10 o’clock.”`, `“Ten! Long past bedtime,” says the bat.`] } },
  { id: 'c8_4', place: 'The Cake on the Stairs', text: [
    `On the next landing, someone has left a cake with candles. A cuckoo pops out of a little door in the wall.`,
    `“Cuckoo! It is nobody’s cake until the clock starts,” it says. “Guess what kind of day is stuck.”` ],
    riddle: { lines: [`I come once a year, but I am not a season.`, `Everybody has one, and nobody can borrow yours.`, `Each time I visit, your number goes up by one.`, `What am I?`],
      options: [
        no(`Winter`, 'snow', `Winter comes once a year. But winter is a season, and everybody shares it.`),
        no(`A full moon`, 'moon', `A full moon comes about once a month, not once a year.`),
        ok(`A birthday`, 'cake'),
        no(`A candle`, 'flame', `Candles come with it. But a candle is not a day.`) ],
      after: [`“A birthday!” you say.`, `“Grandma Glow’s,” whispers Blink. “She cannot turn three hundred and one until the clock moves.”`, `Two stairways go up from here.`] },
    ask: `Which stairs do you take?`, choices: [{ label: `Take the Front Stairs`, to: 'c8_5a' }, { label: `Take the Back Stairs`, to: 'c8_5b' }] },
  { id: 'c8_5a', place: 'The Front Stairs', to: 'c8_6', go: 'Step out behind the clock face', text: [`The stairs are pitch dark, and they twist and split like a maze.`],
    maze: { w: 8, h: 8, seed: 103, kind: 'fog', theme: 'brass', after: [`You come out high up, behind the giant clock face. The moon shines through the glass numbers.`] } },
  { id: 'c8_5b', place: 'The Back Stairs', go: 'Step out behind the clock face', text: [`The stairs are pitch dark, and they twist and split like a maze.`],
    maze: { w: 9, h: 7, seed: 107, kind: 'fog', theme: 'brass', after: [`You come out high up, behind the giant clock face. The moon shines through the glass numbers.`] } },
  { id: 'c8_6', place: 'The Clockmaker’s Table', go: 'Carry the key to the clock', text: [
    `The Clock Mouse keeps his tools up here, and a set of worn old cards.`,
    `“The winding key is under one of these pairs,” he says. “I forget which. Match them all.”` ],
    memory: { icons: ['clock', 'hourglass', 'sundial', 'bell', 'key', 'moon'], after: [`Under the last pair is a big brass winding key.`] } },
  { id: 'c8_7', place: 'The Clock Face', go: 'Go to the Great Clock', text: [

  S.garden = function (o) {

  S.deep = function (o) {

    [[30, 1], [60, -1], [330, 1], [362, -1], [384, 1]].forEach(function (a, i) { s += `<path d="M${a[0]},240 q${a[1] * 12},-26 0,-52 q${-a[1] * 12},-26 0,-${50 + i * 6}" stroke="#2f8a5f" stroke-width="5" fill="none" stroke-linecap="round"/>`; });
    [[90, 60, 4], [104, 34, 2.6], [250, 90, 3.4], [262, 60, 2.2], [320, 40, 3]].forEach(function (b) { s += `<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="none" stroke="${C.ink}" stroke-width="1" opacity="0.6"/>`; });

  S.tunnels = function (o) {
    let s = `<rect width="400" height="260" fill="#17100b"/>`;
    s += `<path d="M-20,70 Q110,30 180,120 T420,190" stroke="#2e2219" stroke-width="58" fill="none"/><path d="M180,120 Q150,200 60,250" stroke="#2e2219" stroke-width="40" fill="none"/>`;
    [[60, 0], [150, 0], [240, 0], [330, 0]].forEach(function (a, i) { s += `<path d="M${a[0]},0 q${i % 2 ? 10 : -10},30 0,${46 + i * 8} M${a[0] + 12},0 q8,16 4,${30 + i * 4}" stroke="#6b4f3a" stroke-width="4" fill="none" stroke-linecap="round"/>`; });

  S.clouds = function (o) {
    let s = stars(70, 131, 0, 0, 400, 200) + moon(64, 56, 24);
    s += `<g fill="#dfe6f5"><rect x="150" y="96" width="34" height="100"/><rect x="216" y="96" width="34" height="100"/><rect x="180" y="62" width="40" height="134"/><rect x="150" y="150" width="100" height="46"/></g>`;

    s += `<g fill="${C.glow}"><rect x="194" y="84" width="12" height="18" rx="6"/><rect x="161" y="112" width="10" height="14" rx="5"/><rect x="228" y="112" width="10" height="14" rx="5"/></g><path d="M188,196 v-24 a12,12 0 0 1 24,0 v24 z" fill="${C.mid}"/>`;
    s += `<g fill="${C.ink}"><ellipse cx="200" cy="206" rx="120" ry="20"/><circle cx="110" cy="198" r="22"/><circle cx="150" cy="190" r="18"/><circle cx="262" cy="192" r="20"/><circle cx="298" cy="202" r="18"/></g>`;
    s += `<g fill="${C.ink}" opacity="0.16"><ellipse cx="60" cy="150" rx="50" ry="10"/><ellipse cx="350" cy="120" rx="46" ry="9"/><ellipse cx="330" cy="244" rx="70" ry="12"/><ellipse cx="60" cy="238" rx="60" ry="11"/></g>`;
    s += blink(300, 150, o.power);
